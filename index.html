<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAVIEW | Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">

</head>

<body>

    <div class="overlay"></div>

    <section class="hero">

        <div class="content">

            <p class="logo">
                ROAVIEW
            </p>

            <h1>
                The Future of <br>
                Luxury Travel Begins Soon.
            </h1>

            <p class="subtitle">
                Premium Chauffeur & Executive Car Rental Services
            </p>

            <p class="launch">
                Launching on
                <span>16 October 2026</span>
            </p>

            <div class="countdown">

                <div class="box">
                    <h2 id="days">00</h2>
                    <span>Days</span>
                </div>

                <div class="box">
                    <h2 id="hours">00</h2>
                    <span>Hours</span>
                </div>

                <div class="box">
                    <h2 id="minutes">00</h2>
                    <span>Minutes</span>
                </div>

                <div class="box">
                    <h2 id="seconds">00</h2>
                    <span>Seconds</span>
                </div>

            </div>

            <div class="buttons">

                <a href="#" class="btn primary">
                    Notify Me
                </a>

                <a href="#" class="btn secondary">
                    Contact Us
                </a>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
